# Semantic metric -> us-gaap tag, per company.
#
# This file is domain knowledge, not engineering configuration. Whether a
# company's "capex" should include finance leases is an investment judgement
# that changes as understanding improves, so it is reviewed alongside the
# supply-chain notes rather than shipped through a code release.
#
# Every entry carries:
#   cik          zero-padded SEC CIK, used to build the companyconcept URL
#   concept      the us-gaap tag this company reports the metric under
#   calibration  how the tag was confirmed to be the right one FOR THIS FILER
#
# THIS FILE CONTAINS NO FINANCIAL VALUES, ON PURPOSE.
#
# It used to carry a known-good value per mapping, to catch the case where a
# filer switches tags and the lookup keeps succeeding against the wrong
# concept. A live run then read this file and emitted those values as market
# facts — byte-identical, and graded `secondary`, so the gate never checked the
# most checkable numbers in the run. They were right that day, which is exactly
# what makes it dangerous: nothing here updates, so a stale pin would be
# reported as current fact with no visible symptom.
#
# The pins now live in tests/network/test_tag_map_regression.py, where the
# agent cannot reach them. This file is a mapping reference: it tells you which
# tag to ask EDGAR for. It is never a source of numbers.

metrics:
  revenue:
    description: >-
      Total revenue for the period. The driver metric when an accelerator
      vendor's own results are the signal being transmitted downstream.
    companies:
      NVDA:
        cik: "0001045810"
        concept: Revenues
        calibration: >-
          VERIFIED 2026-09-08 against companyconcept frames. NVDA reports total
          revenue under `Revenues`; it used
          `RevenueFromContractWithCustomerExcludingAssessedTax` only through
          FY2020 and that concept has had no framed quarter since CY2019Q4.
          Querying the abandoned tag returns HTTP 200 with stale data rather
          than an error — the exact silent drift the regression pin exists to
          catch. Fiscal year ends 31 January, so FY and CY quarters are offset
          by one: FY2027Q2 is CY2026Q2.
      MU:
        cik: "0000723125"
        concept: RevenueFromContractWithCustomerExcludingAssessedTax
        calibration: >-
          VERIFIED 2026-09-08. Micron uses the tag NVIDIA abandoned, and NVIDIA
          uses the one Micron never adopted — `Revenues` on MU is stale since
          CY2018Q3. Two large filers on this chain reporting the same concept
          under opposite tags is why this mapping is per-company and not a
          default with exceptions. Fiscal year ends around end-August, so
          CY2026Q2 is FY2026Q3 — a different offset again from NVDA's January
          year-end.

  capex:
    description: >-
      Cash paid for property, plant and equipment in the period. Several large
      filers report finance-lease additions separately; whether those belong in
      "capex" for transmission purposes is a per-company call and is recorded in
      each `calibration`.
    companies:
      META:
        cik: "0001326801"
        concept: PaymentsToAcquirePropertyPlantAndEquipment
        calibration: >-
          VERIFIED 2026-09-08 against companyconcept frames; 15 quarterly frames
          available, calendar and fiscal quarters aligned (December year-end).
          NOT yet checked against the cash-flow statement for whether principal
          payments on finance leases are reported separately — do that before
          using this for a level comparison rather than a growth rate.
      MSFT:
        cik: "0000789019"
        concept: PaymentsToAcquirePropertyPlantAndEquipment
        calibration: >-
          VERIFIED 2026-09-08; 54 quarterly frames. Fiscal year ends 30 June, so
          CY2026Q1 is FY2026Q3. Comparing "Q1" across this filer and a December
          year-end filer without reading both labels lines up quarters that are
          not the same three months.
      GOOGL:
        cik: "0001652044"
        concept: PaymentsToAcquirePropertyPlantAndEquipment
        calibration: >-
          VERIFIED 2026-09-08; 24 quarterly frames, calendar and fiscal quarters
          aligned (December year-end).
      MU:
        cik: "0000723125"
        concept: PaymentsToAcquirePropertyPlantAndEquipment
        calibration: >-
          VERIFIED 2026-09-08; 18 quarterly frames. Micron is the only HBM
          supplier that files with the SEC, so it is the sole memory node this
          gate can hard-verify at all — SK Hynix and Samsung file in Korea and
          are unreachable here by construction.
